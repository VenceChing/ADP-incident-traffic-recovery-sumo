# 決策順序基準測試配置 - 對照組（同時決策）
RATE: 2500
TIME: 5400
STEP_LENGTH: 1.0
SCENARIO_DIR: "scenarios/grid_4x4"
SUMO_CONFIG: "sim.sumocfg"
NETWORK_FILE: "grid_4x4.net.xml"
USE_GUI: false
RENDER_STRESS: false
REGENERATE_ROUTES: false
RUN_SINGLE_DEMO: false
RUN_TRAINING: false
RUN_EVALUATION: true
RESET_WEIGHTS_FOR_TRAINING: false
LOAD_WEIGHTS_FOR_EVALUATION: true
EVALUATION_CONTROLLERS: ["adp_eval"]
RANDOM_SEED: 7
TRAIN_EPISODES: 140
EVAL_EPISODES_PER_CONTROLLER: 5
TRAIN_INCIDENT_FRACTION: 0.70
INCIDENT_TIME: 1200
DECISION_INTERVAL: 10

# === 決策順序配置 ===
DECISION_ORDER_STRATEGY: "unified"  # 對照組：所有路口同時決策
ALLOW_NEIGHBOR_INFO: false
PREVENT_CONSECUTIVE_DECISION: true
DECISION_ORDER_RANDOM_SEED: 42

TAU: 1.1
ALPHA: 0.0005
GAMMA: 0.95
SWITCH_PENALTY_SCALE: 0.04
ADP_QUEUE_PRIORITY_WEIGHT: 2.0
ADP_MAX_ABS_TD_ERROR: 10.0
ADP_QUEUE_SCALE: 50.0
ADP_DISTANCE_SCALE: 6.0
ADP_TIME_SCALE: 120.0
REROUTING_PROBABILITY: 1.0
REROUTING_PERIOD: 10
